<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Link is Ready</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='20260904-memory-download') }}">
</head>
<body>
    <main class="card form-card">
        <div class="badge">✅ Ready to Send</div>
        <h1>Your Wish Page is Live!</h1>
        <p class="subtitle">Copy this link and send it to them:</p>

        <div class="link-box">
            <input type="text" id="link-field" value="{{ link }}" readonly>
            <button type="button" class="play-btn" onclick="copyLink(this)">Copy</button>
        </div>

        <a href="{{ link }}" target="_blank" class="play-btn reset-btn">👀 Preview It</a>
    </main>

    <script>
        async function copyLink(button) {
            const field = document.getElementById("link-field");
            field.select();

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(field.value);
                } else {
                    document.execCommand("copy");
                }
                button.textContent = "Copied!";
            } catch {
                button.textContent = "Select & Copy";
            }

            setTimeout(() => button.textContent = "Copy", 1500);
        }
    </script>
</body>
</html>
