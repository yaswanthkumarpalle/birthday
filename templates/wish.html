<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, {{ name }}!</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='20260904-chrome-fix') }}">
</head>
<body>
    <div class="sparkle-field" id="sparkle-field"></div>
    <div class="balloons">
        <span>🎈</span><span>🎈</span><span>🎈</span>
        <span>🎈</span><span>🎈</span><span>🎈</span>
    </div>

    <canvas id="confetti"></canvas>

    <!-- GIFT BOX SCREEN -->
    <section id="gift-screen" class="gift-screen">
        <p class="gift-eyebrow">Someone made this just for you...</p>
        <p class="gift-hint">Tap the box to find out what's inside 🎁</p>

        <div class="scene">
            <div id="gift-box" class="box3d">
                <div class="face front">
                    <div class="gift-ribbon" aria-hidden="true">
                        <span class="ribbon-loop left"></span>
                        <span class="ribbon-loop right"></span>
                        <span class="ribbon-knot"></span>
                    </div>
                </div>
                <div class="face back"></div>
                <div class="face right"></div>
                <div class="face left"></div>
                <div class="face top" id="box-lid"></div>
                <div class="face bottom"></div>
                <div class="glow-ring"></div>
            </div>
        </div>

        <p class="gift-sub">From {{ sender }}, with love ❤️</p>
    </section>

    <!-- SLIDESHOW & MESSAGE CARD -->
    <main class="card slideshow-card" id="card">
        <div class="badge">🎂 Happy Birthday</div>
        <h1 id="title-text">Happy Birthday, {{ name }}!</h1>

        <div class="slide-stage" id="slide-stage">
            {% for slide in slides %}
            <div class="slide {% if loop.first %}active{% endif %}" data-index="{{ loop.index0 }}" data-variant="{{ loop.index0 % 5 }}">
                <div class="slide-photo-wrap">
                    <div class="photo-glow"></div>
                    <img src="{{ url_for('static', filename='uploads/' + slide.photo) }}" class="slide-photo" alt="Slide photo" loading="{% if loop.first %}eager{% else %}lazy{% endif %}" decoding="async">
                </div>
                <!-- Pre-filled text with fallback typewriter data attribute -->
                <p class="slide-feeling" data-feeling="{{ slide.feeling }}">{{ slide.feeling }}</p>
            </div>
            {% endfor %}

            <button class="slide-nav slide-prev" type="button" aria-label="Previous photo" hidden>←</button>
            <button class="slide-nav slide-next" type="button" aria-label="Next photo" hidden>→</button>
        </div>

        <div class="progress-dots" id="progress-dots">
            {% for slide in slides %}
                <span class="dot {% if loop.first %}active{% endif %}"></span>
            {% endfor %}
        </div>

        <div class="heart-line">
            <span>💖</span><span>💛</span><span>💙</span><span>💚</span><span>💜</span>
        </div>

        <p class="from-line">— With love, {{ sender }}</p>
    </main>

    <div class="floating-hearts" id="floating-hearts"></div>
    <div class="pop-balloons" id="pop-balloons"></div>

    <!-- SAFELY EMBED JINJA DATA FOR JAVASCRIPT -->
    <script id="wish-data" type="application/json">
        {
            "name": {{ name | tojson | safe }},
            "sender": {{ sender | tojson | safe }},
            "slides": {{ slides | tojson | safe }},
            "balloon_themes": {{ balloon_themes | tojson | safe }}
        }
    </script>

    <script>
        // Safely parse injected Flask JSON data
        const wishData = JSON.parse(document.getElementById('wish-data').textContent);
        const wishName = wishData.name;
        const balloonThemes = wishData.balloon_themes || ["classic"];
        const slideCount = wishData.slides.length;
    </script>

    <script src="{{ url_for('static', filename='birthday.js', v='20260904-chrome-fix') }}"></script>
</body>
</html>
