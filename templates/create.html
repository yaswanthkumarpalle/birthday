<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Birthday Wish</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="card form-card">
        <div class="badge">🎁 Make a Wish Page</div>
        <h1>Create Her Birthday Surprise</h1>
        <p class="subtitle">Add a photo and a feeling for each moment you want to share.</p>

        <form method="post" enctype="multipart/form-data" class="game-form" id="wish-form">
            <input type="text" name="name" placeholder="Her name" required>
            <input type="text" name="sender" placeholder="Your name (from)" required>

            <div class="slide-entry" style="border-style: solid;">
                <label class="slide-label">Balloon Themes (pick one or more)</label>
                <div class="theme-checkboxes">
                    <label class="theme-check"><input type="checkbox" name="balloon_themes" value="classic" checked> 🎈 Classic</label>
                    <label class="theme-check"><input type="checkbox" name="balloon_themes" value="pastel"> 🌸 Pastel</label>
                    <label class="theme-check"><input type="checkbox" name="balloon_themes" value="neon"> ✨ Neon Party</label>
                    <label class="theme-check"><input type="checkbox" name="balloon_themes" value="elegant"> 👑 Elegant Gold</label>
                    <label class="theme-check"><input type="checkbox" name="balloon_themes" value="rainbow"> 🌈 Rainbow</label>
                    <label class="theme-check"><input type="checkbox" name="balloon_themes" value="tropical"> 🌴 Tropical</label>
                    <label class="theme-check"><input type="checkbox" name="balloon_themes" value="love"> 💕 Love</label>
                    <label class="theme-check"><input type="checkbox" name="balloon_themes" value="cake"> 🎂 Cake & Sweets</label>
                    <label class="theme-check"><input type="checkbox" name="balloon_themes" value="celebration"> 🎉 Celebration</label>
                </div>
            </div>

            <div id="slide-list" class="slide-list">
                <div class="slide-entry">
                    <label class="slide-label">Photo 1</label>
                    <input type="file" name="photos" accept="image/*" required>
                    <textarea name="feelings" placeholder="What do you feel when you see this photo?" rows="3" required></textarea>
                </div>
            </div>

            <button type="button" id="add-slide" class="add-btn">+ Add Another Photo</button>
            <button type="submit" class="play-btn" id="generate-btn">✨ Generate Link</button>
            <p class="upload-status" id="upload-status" role="status" aria-live="polite"></p>
        </form>
    </main>

    <script>
        let slideCount = 1;
        const slideList = document.getElementById("slide-list");
        document.getElementById("add-slide").addEventListener("click", () => {
            slideCount++;
            const div = document.createElement("div");
            div.className = "slide-entry";
            div.innerHTML = `
                <label class="slide-label">Photo ${slideCount}</label>
                <input type="file" name="photos" accept="image/*" required>
                <textarea name="feelings" placeholder="What do you feel when you see this photo?" rows="3" required></textarea>
                <button type="button" class="remove-btn">Remove</button>
            `;
            div.querySelector(".remove-btn").addEventListener("click", () => div.remove());
            slideList.appendChild(div);
        });

        const wishForm = document.getElementById("wish-form");
        const generateButton = document.getElementById("generate-btn");
        const uploadStatus = document.getElementById("upload-status");
        const maxPhotoDimension = 1600;

        function resizePhoto(file) {
            return new Promise((resolve) => {
                if (!file.type.startsWith("image/") || file.size < 1024 * 1024) {
                    resolve(file);
                    return;
                }

                const image = new Image();
                const objectUrl = URL.createObjectURL(file);
                image.onload = () => {
                    URL.revokeObjectURL(objectUrl);
                    const scale = Math.min(1, maxPhotoDimension / Math.max(image.naturalWidth, image.naturalHeight));
                    if (scale === 1) {
                        resolve(file);
                        return;
                    }

                    const canvas = document.createElement("canvas");
                    canvas.width = Math.round(image.naturalWidth * scale);
                    canvas.height = Math.round(image.naturalHeight * scale);
                    canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
                    canvas.toBlob((blob) => {
                        resolve(blob ? new File([blob], file.name.replace(/\.[^.]+$/, ".jpg"), { type: "image/jpeg" }) : file);
                    }, "image/jpeg", 0.82);
                };
                image.onerror = () => {
                    URL.revokeObjectURL(objectUrl);
                    resolve(file);
                };
                image.src = objectUrl;
            });
        }

        wishForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            generateButton.disabled = true;
            generateButton.textContent = "Preparing photos...";

            const photoInputs = [...wishForm.querySelectorAll('input[type="file"]')];
            for (let index = 0; index < photoInputs.length; index++) {
                const input = photoInputs[index];
                if (!input.files.length) continue;
                const resizedPhoto = await resizePhoto(input.files[0]);
                const transfer = new DataTransfer();
                transfer.items.add(resizedPhoto);
                input.files = transfer.files;
                uploadStatus.textContent = `Preparing photo ${index + 1} of ${photoInputs.length}...`;
            }

            uploadStatus.textContent = "Uploading your wish...";
            wishForm.submit();
        });
    </script>
</body>
</html>
